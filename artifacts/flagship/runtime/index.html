<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERVEIL — a warden of dying fires</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d0805;
    --ember: #ff7a1a;
    --gold: #ffd166;
    --amber: #ffb347;
    --warm-shadow: #1a0e05;
    --text: #f6e7d0;
    --text-dim: #b89a76;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #scene { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- identity UI ---------- */
  .wordmark {
    position: fixed; top: 34px; left: 42px; z-index: 10; user-select: none;
    font-family: Georgia, "Times New Roman", serif; letter-spacing: 0.42em;
    font-size: 15px; color: var(--gold); text-transform: uppercase;
    text-shadow: 0 0 24px rgba(255, 122, 26, 0.35);
    animation: fade-in 2.4s ease both;
  }
  .wordmark .dot { color: var(--ember); }
  .caption {
    position: fixed; top: 66px; left: 43px; z-index: 10;
    font-size: 11px; letter-spacing: 0.18em; color: var(--text-dim);
    text-transform: lowercase; animation: fade-in 2.4s ease 0.4s both;
  }
  .hint {
    position: fixed; bottom: 34px; left: 42px; z-index: 10;
    font-size: 11px; letter-spacing: 0.14em; color: var(--text-dim);
    animation: fade-in 2.4s ease 1.2s both;
  }
  .hint .key { color: var(--amber); }
  .sigil {
    position: fixed; bottom: 26px; right: 38px; z-index: 10;
    width: 46px; height: 62px; opacity: 0.85; animation: fade-in 3s ease 1.6s both;
  }
  .sigil .bell {
    width: 34px; height: 44px; margin: 0 auto;
    border: 1.5px solid var(--ember); border-radius: 46% 46% 42% 42% / 30% 30% 70% 70%;
    position: relative;
  }
  .sigil .bell::after {
    content: ""; position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    width: 10px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 50% 70%, var(--gold), var(--ember) 70%);
    animation: core-pulse 3.2s ease-in-out infinite;
  }
  .sigil .flame {
    position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
    width: 5px; height: 12px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: linear-gradient(var(--gold), var(--ember));
    filter: blur(1px); animation: core-pulse 1.6s ease-in-out infinite;
  }
  .frame {
    position: fixed; inset: 16px; z-index: 5; pointer-events: none;
    border: 1px solid rgba(255, 209, 102, 0.12);
  }
  #status {
    position: fixed; top: 34px; right: 42px; z-index: 10;
    font-size: 10px; letter-spacing: 0.2em; color: var(--text-dim);
    text-transform: uppercase; animation: fade-in 2.4s ease 0.8s both;
  }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-dim); letter-spacing: 0.3em; font-size: 12px;
    transition: opacity 0.8s ease; text-transform: uppercase;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .pulse { color: var(--ember); animation: core-pulse 1.2s ease-in-out infinite; }

  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes core-pulse { 0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.18); } }

  @media (prefers-reduced-motion: reduce) {
    .wordmark, .caption, .hint, .sigil, #status, #loading { animation: none; }
    .sigil .bell::after, .sigil .flame { animation: none; }
  }
  @media (max-width: 700px) {
    .wordmark { top: 24px; left: 24px; font-size: 12px; }
    .caption { top: 50px; left: 25px; font-size: 10px; }
    .hint { bottom: 22px; left: 24px; font-size: 10px; }
    #status { top: 24px; right: 24px; font-size: 9px; }
    .sigil { bottom: 18px; right: 22px; transform: scale(0.85); }
  }
</style>
</head>
<body>
<div id="loading"><span>kindling&nbsp;<span class="pulse">·</span></span></div>
<div id="scene"></div>
<div class="frame"></div>
<header class="wordmark">Emberveil<span class="dot">.</span></header>
<div class="caption">a warden of dying fires</div>
<div id="status">calibration artifact</div>
<div class="hint"><span class="key">move</span> to look &nbsp;·&nbsp; <span class="key">click</span> to ignite</div>
<div class="sigil" aria-hidden="true">
  <div class="bell"><div class="flame"></div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const container = document.getElementById("scene");
const loading = document.getElementById("loading");

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0805);
scene.fog = new THREE.FogExp2(0x0d0805, 0.055);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 2.0, 5.2);

/* ---------- restrained bloom: emission supports, not replaces, lighting ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.52, 0.32, 0.78);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ---------- motivated lighting ---------- */
scene.add(new THREE.AmbientLight(0x2a1a0e, 0.5));
const key = new THREE.PointLight(0xff7a1a, 9, 14, 1.6);
key.position.set(0, 1.35, 0.2);
scene.add(key);
const glow = new THREE.PointLight(0xff5a00, 2.2, 7, 1.8);
glow.position.set(0, 0.1, 0);
scene.add(glow);
const rim = new THREE.DirectionalLight(0x67d9ff, 0.5);
rim.position.set(-5, 3.5, -4);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffb347, 0.35);
fill.position.set(3, 1.2, 3);
scene.add(fill);

/* ---------- ember VFX (signature: contained fire escaping as sparks) ---------- */
const EMBERS = reducedMotion ? 120 : 420;
const emberGeo = new THREE.BufferGeometry();
const pos = new Float32Array(EMBERS * 3);
const vel = new Float32Array(EMBERS * 3);
const life = new Float32Array(EMBERS);
const maxLife = new Float32Array(EMBERS);
const seed = () => {
  for (let i = 0; i < EMBERS; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * 1.3;
    pos[i*3] = Math.cos(a) * r; pos[i*3+1] = 0.4 + Math.random() * 2.4; pos[i*3+2] = Math.sin(a) * r;
    vel[i*3] = (Math.random()-0.5) * 0.5; vel[i*3+1] = 0.25 + Math.random() * 0.8; vel[i*3+2] = (Math.random()-0.5) * 0.5;
    maxLife[i] = life[i] = 1.2 + Math.random() * 2.6;
  }
};
seed();
emberGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const emberCanvas = document.createElement("canvas");
emberCanvas.width = emberCanvas.height = 32;
const emberCtx = emberCanvas.getContext("2d");
const emberGradient = emberCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
emberGradient.addColorStop(0, "rgba(255,245,190,1)");
emberGradient.addColorStop(0.28, "rgba(255,160,55,0.95)");
emberGradient.addColorStop(1, "rgba(255,80,0,0)");
emberCtx.fillStyle = emberGradient; emberCtx.fillRect(0, 0, 32, 32);
const emberTexture = new THREE.CanvasTexture(emberCanvas);
const emberMat = new THREE.PointsMaterial({
  color: 0xffa040, map: emberTexture, alphaTest: 0.01, size: 0.09, transparent: true, opacity: 0.92,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
});
const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

/* ignite burst particles */
const BURST = 160;
const burstGeo = new THREE.BufferGeometry();
const bPos = new Float32Array(BURST * 3);
const bVel = new Float32Array(BURST * 3);
const bLife = new Float32Array(BURST);
burstGeo.setAttribute("position", new THREE.BufferAttribute(bPos, 3));
const burstMat = new THREE.PointsMaterial({
  color: 0xffd166, size: 0.09, transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
});
const burst = new THREE.Points(burstGeo, burstMat);
burst.visible = false;
scene.add(burst);
let burstT = -1;

/* ---------- hero ---------- */
const loader = new GLTFLoader();
let hero = null, mixer = null, floatAction = null, activeActions = [], animationClips = [], rootObj = null;
loader.load("../emberveil-canonical/emberveil-canonical.glb", (gltf) => {
  hero = gltf.scene;
  // keep the authored hierarchy intact (no cameras/lights in this GLB);
  // any imported cameras/lights would be dropped here, meshes never moved
  hero.traverse((o) => {
    if ((o.isCamera || o.isLight) && o.parent) o.parent.remove(o);
  });
  rootObj = hero.getObjectByName("Emberveil_root") || hero;
  scene.add(hero);

  if (gltf.animations.length) {
    // Play the complete authored motion set together: float, core pulse, ring
    // drift, and filigree secondary motion. Do not silently discard clips.
    mixer = new THREE.AnimationMixer(hero);
    animationClips = gltf.animations.map((clip) => clip.name || 'unnamed');
    activeActions = gltf.animations.map((clip) => {
      const action = mixer.clipAction(clip, hero);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
      return action;
    });
    floatAction = activeActions[0] || null;
  }
  loading.classList.add("hidden");
}, undefined, (err) => {
  loading.textContent = "the fire would not kindle — " + (err && err.message ? err.message : "load failed");
  loading.style.color = "#ff7a1a";
});

/* ---------- interaction ---------- */
const pointer = { x: 0, y: 0 };
window.addEventListener("pointermove", (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -((e.clientY / window.innerHeight) * 2 - 1);
}, { passive: true });

function ignite() {
  if (burstT >= 0) return; // already igniting
  burstT = 0;
  const cx = rootObj ? rootObj.position.x : 0;
  const cy = rootObj ? rootObj.position.y + 1.5 : 1.5;
  const cz = rootObj ? rootObj.position.z : 0;
  for (let i = 0; i < BURST; i++) {
    const a = Math.random() * Math.PI * 2, e = Math.random() * Math.PI * 0.7;
    const sp = 1.2 + Math.random() * 2.6;
    bPos[i*3] = cx; bPos[i*3+1] = cy; bPos[i*3+2] = cz;
    bVel[i*3] = Math.sin(e) * Math.cos(a) * sp;
    bVel[i*3+1] = Math.cos(e) * sp * 0.8 + 0.6;
    bVel[i*3+2] = Math.sin(e) * Math.sin(a) * sp;
    bLife[i] = 0.9 + Math.random() * 0.8;
  }
  burst.visible = true;
  burstMat.opacity = 1;
}
window.addEventListener("click", ignite);

/* ---------- animation loop ---------- */
const clock = new THREE.Clock();
let t = 0;
const baseOrbit = { radius: 5.1, height: 1.9, theta: 0 };
let pushIn = 0; // ignite camera push

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  if (mixer) mixer.update(dt);

  /* embers: drift up, fade, respawn near the core */
  const p = emberGeo.attributes.position.array;
  for (let i = 0; i < EMBERS; i++) {
    life[i] -= dt;
    if (life[i] <= 0) {
      const a = Math.random() * Math.PI * 2, r = Math.random() * 1.1;
      p[i*3] = Math.cos(a) * r; p[i*3+1] = 0.35; p[i*3+2] = Math.sin(a) * r;
      vel[i*3+1] = 0.25 + Math.random() * 0.8;
      life[i] = maxLife[i];
    }
    p[i*3] += vel[i*3] * dt;
    p[i*3+1] += vel[i*3+1] * dt;
    p[i*3+2] += vel[i*3+2] * dt;
    if (p[i*3+1] > 4.2) { p[i*3+1] = 0.35; }
  }
  emberGeo.attributes.position.needsUpdate = true;
  emberMat.opacity = 0.75 + 0.2 * Math.sin(t * 2.3);

  /* burst */
  if (burstT >= 0) {
    burstT += dt;
    const bp = burstGeo.attributes.position.array;
    for (let i = 0; i < BURST; i++) {
      bLife[i] -= dt;
      if (bLife[i] > 0) {
        bp[i*3] += bVel[i*3] * dt;
        bp[i*3+1] += bVel[i*3+1] * dt - 0.9 * dt;
        bp[i*3+2] += bVel[i*3+2] * dt;
      } else {
        bp[i*3+1] = -10;
      }
    }
    burstGeo.attributes.position.needsUpdate = true;
    burstMat.opacity = Math.max(0, 1 - burstT * 1.4);
    key.intensity = 9 + 14 * Math.max(0, 1 - burstT * 2.2);
    if (burstT > 1.6) { burstT = -1; burst.visible = false; burstMat.opacity = 0; }
  } else {
    /* ember core flicker: fast high-frequency noise on the key light */
    key.intensity = 8.6 + Math.sin(t * 31.7) * 0.9 + Math.sin(t * 17.3) * 0.6;
    glow.intensity = 2.1 + Math.sin(t * 13.1) * 0.25;
  }

  /* camera: slow orbit + parallax + ignite push-in */
  if (!reducedMotion) {
    baseOrbit.theta += dt * 0.12;
  }
  const targetPush = burstT >= 0 && burstT < 1.0 ? 0.7 : 0;
  pushIn += (targetPush - pushIn) * Math.min(1, dt * 4);
  const radius = baseOrbit.radius - pushIn;
  const hgt = baseOrbit.height + Math.sin(t * 0.4) * 0.15;
  const px = reducedMotion ? 0 : pointer.x * 0.45;
  const py = reducedMotion ? 0 : pointer.y * 0.25;
  camera.position.x = Math.cos(baseOrbit.theta) * radius + px;
  camera.position.z = Math.sin(baseOrbit.theta) * radius;
  camera.position.y = hgt + py;
  camera.lookAt(px * 0.6, 1.15 + py * 0.4, 0);

  composer.render();
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.resolution.set(window.innerWidth, window.innerHeight);
});

/* ---------- observability hook (read-only, for QA tooling) ---------- */
let _frames = 0, _lastT = performance.now(), _fps = 0;
setInterval(() => {
  const now = performance.now();
  _fps = _frames / Math.max(0.001, (now - _lastT) / 1000);
  _frames = 0; _lastT = now;
}, 1000);
window.__emberveil = {
  getState: () => ({
    t: t,
    mixerTime: mixer ? mixer.time : null,
    playing: !!(mixer && floatAction && floatAction.isRunning()),
    rootY: rootObj ? rootObj.position.y : null,
    rootPos: rootObj ? rootObj.position.toArray() : null,
    cameraPos: camera.position.toArray(),
    emberCount: EMBERS,
    fps: Math.round(_fps),
    heroLoaded: !!hero,
    animationClips,
    activeAnimationCount: activeActions.filter((action) => action.isRunning()).length,
  }),
};
</script>
</body>
</html>
