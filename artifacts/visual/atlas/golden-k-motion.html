<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K — Choreographed Motion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080c;display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;overflow:hidden;font-family:'Inter','Helvetica Neue',sans-serif}
.stage{position:relative;width:600px;height:600px}
.shape{position:absolute;border-radius:50%;opacity:0}
/* Anticipation-settle-stagger entrance choreography */
.s1{width:120px;height:120px;background:linear-gradient(135deg,#c9a84c,#8b6914);top:50%;left:50%;transform:translate(-50%,-50%) scale(0) rotate(-180deg);
    animation:enter-1 1.8s cubic-bezier(0.34,1.56,0.64,1) 0.2s forwards,
             glow-pulse 4s ease-in-out 2s infinite}
.s2{width:80px;height:80px;background:linear-gradient(135deg,#3a7bd5,#00d2ff);top:15%;left:20%;
    animation:enter-2 1.4s cubic-bezier(0.22,1,0.36,1) 0.5s forwards}
.s3{width:60px;height:60px;background:linear-gradient(135deg,#6366f1,#a855f7);top:18%;right:22%;
    animation:enter-3 1.2s cubic-bezier(0.22,1,0.36,1) 0.8s forwards}
.s4{width:90px;height:45px;border-radius:22px;background:linear-gradient(135deg,#f59e0b,#ef4444);bottom:20%;left:15%;
    animation:enter-4 1.5s cubic-bezier(0.22,1,0.36,1) 1.1s forwards}
.s5{width:50px;height:50px;background:linear-gradient(135deg,#10b981,#059669);bottom:22%;right:18%;
    animation:enter-5 1.0s cubic-bezier(0.22,1,0.36,1) 1.4s forwards}
/* Connecting lines */
.line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),transparent);opacity:0;transform-origin:left center}
.l1{width:160px;top:50%;left:50%;transform:rotate(-30deg);animation:line-in 0.8s ease 1.6s forwards}
.l2{width:140px;top:50%;left:50%;transform:rotate(30deg);animation:line-in 0.8s ease 1.8s forwards}
.l3{width:180px;top:50%;left:50%;transform:rotate(140deg);animation:line-in 0.8s ease 2.0s forwards}
/* Title */
.title{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);text-align:center;opacity:0;
    animation:text-in 1.2s cubic-bezier(0.22,1,0.36,1) 2.2s forwards}
.title span{display:block;font-size:32px;font-weight:200;letter-spacing:16px;color:#c9a84c;text-transform:uppercase}
.title small{display:block;margin-top:8px;font-size:10px;letter-spacing:4px;color:rgba(255,255,255,0.3);text-transform:uppercase}
/* Ambient glow */
.glow{position:absolute;top:50%;left:50%;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(201,168,76,0.08),transparent 70%);
    transform:translate(-50%,-50%);animation:ambient 6s ease-in-out infinite}

@keyframes enter-1{0%{transform:translate(-50%,-50%) scale(0) rotate(-180deg);opacity:0}60%{transform:translate(-50%,-50%) scale(1.15) rotate(10deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1}}
@keyframes enter-2{0%{transform:translateY(80px) scale(0);opacity:0}70%{transform:translateY(-8px) scale(1.08);opacity:1}100%{transform:translateY(0) scale(1);opacity:0.9}}
@keyframes enter-3{0%{transform:translateX(60px) scale(0);opacity:0}70%{transform:translateX(-5px) scale(1.1);opacity:1}100%{transform:translateX(0) scale(1);opacity:0.9}}
@keyframes enter-4{0%{transform:translateY(-50px) scaleX(0.3);opacity:0}60%{transform:translateY(5px) scaleX(1.08);opacity:1}100%{transform:translateY(0) scaleX(1);opacity:0.85}}
@keyframes enter-5{0%{transform:scale(0) rotate(90deg);opacity:0}70%{transform:scale(1.2) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0.9}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 40px rgba(201,168,76,0.2)}50%{box-shadow:0 0 80px rgba(201,168,76,0.4)}}
@keyframes line-in{0%{opacity:0}100%{opacity:0.4}}
@keyframes text-in{0%{opacity:0;transform:translateX(-50%) translateY(10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes ambient{0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}

@media(prefers-reduced-motion:reduce){.shape,.line,.title,.glow{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
<div class="stage">
    <div class="glow"></div>
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="title"><span>Choreography</span><small>Anticipation + Settle + Stagger</small></div>
</div>
</body>
</html>
