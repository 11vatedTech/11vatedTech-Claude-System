  <path d="M 423.2 300.0 C 423.1 302.4 416.5 306.5 416.4 308.9 C 414.2 309.9 406.9 307.1 404.7 308.1 C 403.5 306.0 409.6 297.2 408.4 295.1 C 409.7 293.1 416.0 289.9 417.3 287.9 C 419.6 288.6 420.9 299.2 423.2 300.0 Z" fill="#00ff88" opacity="0.15" filter="url(#glow)"/><path d="M 405.5 355.0 C 405.4 358.0 395.0 361.4 394.9 364.4 C 392.1 365.6 383.9 363.7 381.1 364.9 C 379.5 362.3 386.2 350.8 384.6 348.2 C 386.2 345.7 394.1 345.1 395.7 342.6 C 398.6 343.5 402.7 354.1 405.5 355.0 Z" fill="#00ff88" opacity="0.15" filter="url(#glow)"/><path d="M 344.4 328.0 C 344.4 331.6 331.3 334.9 331.3 338.5 C 327.9 339.8 320.5 336.6 317.1 337.9 C 315.1 334.9 319.9 321.8 317.9 318.8 C 319.9 315.8 329.5 319.7 331.5 316.8 C 334.9 317.9 341.0 326.8 344.4 328.0 Z" fill="#00ff88" opacity="0.15" filter="url(#glow)"/><path d="M 302.2 300.0 C 302.4 304.2 289.0 309.1 289.2 313.3 C 285.2 314.6 279.9 307.2 275.9 308.5 C 273.5 305.0 274.7 291.9 272.3 288.4 C 274.7 284.9 286.0 293.3 288.4 289.8 C 292.3 291.3 298.3 298.5 302.2 300.0 Z" fill="#00ff88" opacity="0.15" filter="url(#glow)"/><path d="M 322.9 245.1 C 323.2 249.9 312.3 258.0 312.5 262.8 C 307.9 264.2 304.4 250.7 299.8 252.1 C 297.2 248.0 295.2 236.0 292.6 231.9 C 295.1 227.8 308.4 237.7 310.9 233.6 C 315.3 235.5 318.5 243.2 322.9 245.1 Z" fill="#00ff88" opacity="0.15" filter="url(#glow)"/><path d="M 384.5 272.1 C 384.7 277.5 377.4 289.7 377.7 295.1 C 372.5 296.8 368.5 277.5 363.4 279.2 C 360.6 274.6 358.6 263.2 355.8 258.5 C 358.4 253.8 373.3 260.5 375.9 255.8 C 380.8 258.1 379.6 269.8 384.5 272.1 Z" fill="#00ff88" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Belly glow -->
  <ellipse cx="350" cy="360" rx="60" ry="15" fill="#00ff88" opacity="0.06" filter="url(#glow)"/>
</svg>