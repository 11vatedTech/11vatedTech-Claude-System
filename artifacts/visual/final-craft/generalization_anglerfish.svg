  <circle cx="460" cy="250" r="3.5" fill="#110022"/>
  <circle cx="461" cy="249" r="1.2" fill="#ff6699" opacity="0.8"/>
  
  <!-- Lure stalk -->
  <path d="M 450 220 C 440 150 480 100 500 80" stroke="#0d3020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 450 220 C 440 150 480 100 500 80" stroke="#00ff88" stroke-width="0.8" fill="none" stroke-linecap="round" filter="url(#glow)" opacity="0.4"/>
  
